<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="description" content="A browser-based math game for kids." />
    <title>mathBasher</title>

    <!--
      Google Fonts — Baloo 2 (sprint 0.7 Story 7). Used by every text
      element in the game via `FONT_FAMILY` in `src/game/ui/typography.ts`.
      `display=swap` shows fallback (system-ui) immediately and swaps to
      Baloo 2 once the font is loaded (no FOIT — eliminates the "blank
      text for 100ms" flash). Two weights: 400 (body), 700 (titles,
      buttons, alien block numbers).
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      html, body { margin: 0; padding: 0; height: 100%; background: #0b1020; overflow: hidden; }
      body { font-family: 'Baloo 2', system-ui, -apple-system, sans-serif; color: #eaeaf2; }
      #game { width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; }
      /* Splash overlay — shown until the user clicks "Tap to play".
         Constructing Phaser inside the click handler ensures the
         AudioContext is created inside a user-gesture context
         (eliminates the "AudioContext was prevented from starting
         automatically" browser warning) and gives iOS Safari the
         first-gesture audio context creation it requires. After the
         click, main.ts hides the element by adding the `.hidden` class
         (display: none) — the node stays in the DOM for stable inspection
         and to support a future replay/teardown path, but is invisible
         and non-interactive. */
      #splash {
        position: fixed; inset: 0; z-index: 10;
        background: #0b1020;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 1.5rem;
        color: #eaeaf2;
        font-family: system-ui, -apple-system, sans-serif;
      }
      #splash h1 { font-size: 3rem; margin: 0; letter-spacing: 0.02em; }
      #splash p { font-size: 1rem; margin: 0; color: #9ca3af; }
      #splash button {
        font-size: 1.5rem; padding: 0.75rem 2rem;
        background: #1f2740; color: #eaeaf2;
        border: 2px solid #6b7280; border-radius: 6px;
        cursor: pointer;
        font-family: inherit;
      }
      #splash button:hover { background: #2a3454; }
      #splash button:focus { outline: none; border-color: #60a5fa; }
      /* :active gives a tactile "press" — slight inset shift + darker fill,
         so the button visibly responds the instant a finger/mouse goes down,
         not when it goes up. Adds polish on touch devices where the hover
         state never fires. */
      #splash button:active { background: #161b2c; transform: translateY(1px); }
      #splash.hidden { display: none; }

      /* Splash loading bar (sprint 2.1.8). Hidden by default; revealed
         when `#splash` gets the `.loading-active` class (added on
         "Tap to play" click). The button is hidden simultaneously
         so the splash content morphs in place: title + subtitle stay,
         button → bar. Bar lives in the DOM rather than Phaser because
         it must render IMMEDIATELY post-tap, before Phaser's
         construction + first frame paint — only the existing DOM
         splash overlay is on-screen at that moment. */
      #splash-loading {
        display: none;
        flex-direction: column;
        align-items: center;
        gap: 0.5rem;
      }
      #splash-loading-label {
        font-size: 1rem;
        color: #9ca3af;
        font-family: inherit;
      }
      #splash-loading-track {
        width: 320px;
        height: 16px;
        background: #1f2740;
        border: 2px solid #475569;
        border-radius: 8px;
        overflow: hidden;
      }
      #splash-loading-fill {
        height: 100%;
        width: 0%;
        background: #fbbf24;
        /* Smooth fill animation — 120ms matches the snappy-but-not-
           instant feel of the Phaser loading bar (sprint 0.6.3). */
        transition: width 120ms linear;
      }
      #splash.loading-active #splash-start { display: none; }
      #splash.loading-active #splash-loading { display: flex; }

      /* Portrait-rotate overlay (sprint 0.6). Hidden by default; the media
         query below shows it when a phone-sized viewport is in portrait.
         The game is designed for landscape (1280×720) — portrait would
         either letterbox heavily (with FIT) or break gameplay tuning, so
         we gate the experience until the user rotates. The overlay sits
         above EVERYTHING (z-index higher than splash) so it can intercept
         a portrait-load too: even if the splash is the foreground UI, the
         rotate prompt takes precedence on a portrait phone.

         Why a phone-only media query (max-width: 900px): a desktop user
         resizing to a portrait window pose isn't a real player; we don't
         want to nag them. 900px catches phones up to iPhone Pro Max in
         portrait but excludes most tablets and all desktop windows. */
      #rotate-overlay {
        display: none;
        position: fixed; inset: 0; z-index: 100;
        background: #0b1020;
        flex-direction: column;
        align-items: center; justify-content: center; gap: 1.5rem;
        color: #eaeaf2;
        font-family: system-ui, -apple-system, sans-serif;
        padding: 2rem;
        text-align: center;
      }
      #rotate-overlay .glyph {
        /* Pure-CSS rotated phone glyph — a slim rectangle with a small
           inset speaker dot, animated to suggest the rotation motion.
           No SVG needed; works on every browser without an asset. */
        width: 56px; height: 96px;
        border: 3px solid #eaeaf2; border-radius: 8px;
        position: relative;
        animation: rotateHint 2s ease-in-out infinite;
      }
      #rotate-overlay .glyph::after {
        content: '';
        position: absolute; top: 6px; left: 50%; transform: translateX(-50%);
        width: 18px; height: 3px;
        background: #eaeaf2; border-radius: 2px;
      }
      @keyframes rotateHint {
        0%, 40% { transform: rotate(0deg); }
        50%, 90% { transform: rotate(-90deg); }
        100% { transform: rotate(0deg); }
      }
      #rotate-overlay h2 { font-size: 1.5rem; margin: 0; }
      #rotate-overlay p { font-size: 1rem; margin: 0; color: #9ca3af; max-width: 300px; }
      @media (orientation: portrait) and (max-width: 900px) {
        #rotate-overlay { display: flex; }
      }
    </style>
  </head>
  <body>
    <div id="splash">
      <h1>mathBasher</h1>
      <p>Math, but with aliens.</p>
      <button id="splash-start" type="button" autofocus>Tap to play</button>
      <div id="splash-loading" aria-live="polite">
        <div id="splash-loading-label">Loading…</div>
        <div id="splash-loading-track">
          <div id="splash-loading-fill"></div>
        </div>
      </div>
    </div>
    <!-- aria-live="polite" alone (no role="alert") — `role=alert` implies
         assertive announcement, which contradicts polite. The rotate prompt
         is instructional, not emergent, so polite is the right pairing. -->
    <div id="rotate-overlay" aria-live="polite">
      <div class="glyph" aria-hidden="true"></div>
      <h2>Turn your phone sideways!</h2>
      <p>mathBasher plays better wide.</p>
    </div>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
