<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- mathBasher tab icon: a chunky green toy blaster, nose pointing right. -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6ef08a"/>
      <stop offset="1" stop-color="#18a34a"/>
    </linearGradient>
  </defs>
  <!-- muzzle glow -->
  <circle cx="57" cy="24" r="6" fill="#d9ff6b"/>
  <circle cx="57" cy="24" r="3" fill="#ffffff"/>
  <!-- grip -->
  <path d="M15 30 L29 30 L25 54 Q24 58 20 58 L13 58 Q9 58 10 54 Z" fill="#14803a" stroke="#0b3d1e" stroke-width="3" stroke-linejoin="round"/>
  <!-- trigger guard -->
  <path d="M27 36 Q34 36 34 43 L29 43" fill="none" stroke="#0b3d1e" stroke-width="3" stroke-linecap="round"/>
  <!-- barrel -->
  <rect x="34" y="18" width="18" height="12" rx="3" fill="url(#body)" stroke="#0b3d1e" stroke-width="3"/>
  <!-- body -->
  <rect x="5" y="12" width="33" height="22" rx="8" fill="url(#body)" stroke="#0b3d1e" stroke-width="3"/>
  <!-- barrel rings -->
  <rect x="40" y="16" width="4" height="16" rx="1.5" fill="#0b3d1e"/>
  <rect x="47" y="16" width="4" height="16" rx="1.5" fill="#0b3d1e"/>
  <!-- body window + shine -->
  <rect x="12" y="18" width="14" height="7" rx="3.5" fill="#d9ff6b" stroke="#0b3d1e" stroke-width="2"/>
  <rect x="10" y="14.5" width="18" height="3" rx="1.5" fill="#ffffff" opacity="0.45"/>
</svg>
