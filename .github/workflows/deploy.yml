name: Deploy to Azure Static Web Apps

# Push-triggered deploys, two SEPARATE Free Static Web Apps (one per env):
#   push to `development` -> dev SWA  (AZURE_SWA_TOKEN_DEV),  production env
#   push to `main`        -> prod SWA (AZURE_SWA_TOKEN_PROD), production env
# Each SWA serves its own custom domain on its own production environment —
# the Free tier can't bind a custom domain to a preview/named environment, so
# there's one Free SWA per environment (see infra/README.md). No pull_request
# trigger, so no per-PR preview environments.
on:
  push:
    branches:
      - main
      - development

# Only the latest push per branch deploys; an in-flight run is superseded.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Node 22: pnpm 11 (sprint 2.5.1) requires Node >= 22.13 — it uses
          # the `node:sqlite` builtin, which doesn't exist on Node 20 and
          # crashes `setup-node`'s `cache: pnpm` step (ERR_UNKNOWN_BUILTIN_MODULE).
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build:client
        env:
          # AGPL §13 "Corresponding Source" link shown in the UI footer
          # (attribution.ts reads VITE_SOURCE_URL; Vite inlines it at build).
          # Point each deployment at the branch it was built from, so the link
          # matches the running version: main -> repo root (default branch),
          # development -> the development tree.
          VITE_SOURCE_URL: ${{ github.ref_name == 'main' && 'https://github.com/rklundt/mathBasher' || 'https://github.com/rklundt/mathBasher/tree/development' }}

      - name: Run tests
        run: pnpm test

      - name: Deploy to Azure Static Web Apps
        id: deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          # Per-branch token selects the matching SWA: `main` -> prod SWA,
          # anything else (i.e. `development`) -> dev SWA. Each token is that
          # SWA's deploy key, stored as a GitHub Actions secret.
          azure_static_web_apps_api_token: ${{ github.ref_name == 'main' && secrets.AZURE_SWA_TOKEN_PROD || secrets.AZURE_SWA_TOKEN_DEV }}
          action: upload
          # We build with pnpm above; skip_app_build tells the action not to
          # run its own (Oryx) build. With the build skipped, `app_location`
          # is the folder the action uploads — point it straight at the
          # built `dist/`. (Pointing it at repo root uploads node_modules
          # and busts the SWA 250 MB content limit.) `output_location` is
          # unused when skip_app_build is true.
          skip_app_build: true
          app_location: "dist"
          api_location: ""
          output_location: ""
          # No deployment_environment: each branch deploys to ITS OWN SWA's
          # production environment (the token picks the SWA). The custom domain
          # for that environment binds to this production env.

      # Post-deploy smoke test — `pnpm test` above checks the code; this
      # checks the LIVE site responds. Catches a deploy that uploaded but
      # serves a broken entry point. Uses the URL the deploy step reports;
      # if the action exposes none, it warns rather than red-failing.
      - name: Smoke-test the deployment
        run: |
          URL="${{ steps.deploy.outputs.static_web_app_url }}"
          if [ -z "$URL" ]; then
            echo "::warning::Deploy step exposed no URL — skipping smoke test."
            exit 0
          fi
          case "$URL" in http*) ;; *) URL="https://$URL" ;; esac
          echo "Smoke-testing $URL ..."
          code=000
          for attempt in 1 2 3; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$URL/" || echo 000)
            [ "$code" = "200" ] && break
            echo "Attempt $attempt: HTTP $code — retrying in 10s"
            sleep 10
          done
          ctype=$(curl -s -o /dev/null -w '%{content_type}' "$URL/" || echo "")
          echo "Result: HTTP $code, Content-Type: $ctype"
          [ "$code" = "200" ] || { echo "::error::Smoke test failed — expected HTTP 200, got $code"; exit 1; }
          case "$ctype" in
            text/html*) ;;
            *) echo "::error::Smoke test failed — expected text/html, got '$ctype'"; exit 1 ;;
          esac
          echo "Smoke test passed."
