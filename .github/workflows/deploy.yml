name: Deploy to Azure Static Web Apps

# Push-triggered deploys, two SEPARATE Free Static Web Apps (one per env):
#   push to `development` -> dev SWA,  via the `development` GitHub Environment
#   push to `main`        -> prod SWA, via the `production` GitHub Environment
# Each GitHub Environment holds its own AZURE_SWA_TOKEN secret and only
# accepts deploys from its branch, so the prod token can't be read by a
# workflow running on any other branch. Pull requests are checked by ci.yml.
# Each SWA serves its own custom domain on its own production environment —
# the Free tier can't bind a custom domain to a preview/named environment, so
# there's one Free SWA per environment (see infra/README.md). No pull_request
# trigger, so no per-PR preview environments.
on:
  push:
    branches:
      - main
      - development

# Only the latest push per branch deploys. On `development` an in-flight run
# is superseded; on `main` (prod) it runs to the end rather than being cut
# off mid-upload.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

permissions:
  contents: read

jobs:
  build-and-deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    # The branch picks the GitHub Environment (and with it the deploy token
    # and the protection rules): main -> production, development -> development.
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'development' }}
      url: ${{ github.ref_name == 'main' && 'https://mathbasher.mykfam.com' || 'https://mathbasher-dev.mykfam.com' }}
    steps:
      # Actions are pinned to full commit SHAs (the tag is in the comment), so
      # a moved or compromised tag can't change the action code that runs.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Node 22: pnpm 11 (sprint 2.5.1) requires Node >= 22.13 — it uses
          # the `node:sqlite` builtin, which doesn't exist on Node 20 and
          # crashes `setup-node`'s `cache: pnpm` step (ERR_UNKNOWN_BUILTIN_MODULE).
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # AGPL §13 "Corresponding Source" link shown in the UI footer
      # (attribution.ts reads VITE_SOURCE_URL; Vite inlines it at build).
      # Pinned to the EXACT commit being built (short SHA), so the link always
      # matches the running version — on either environment, and even when an
      # older run is re-run as a rollback (a branch link would point at the
      # branch's current tip instead).
      - name: Resolve source URL
        run: echo "VITE_SOURCE_URL=https://github.com/${GITHUB_REPOSITORY}/tree/${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Build
        run: pnpm build:client

      - name: Run tests
        run: pnpm test

      # Fail closed: refuse to deploy if this environment's token is missing
      # (e.g. the environment was recreated without its secret).
      - name: Check deploy token
        env:
          TOKEN: ${{ secrets.AZURE_SWA_TOKEN }}
          TARGET: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Secret AZURE_SWA_TOKEN is empty or missing in this environment — refusing to deploy branch '$GITHUB_REF_NAME'."
            exit 1
          fi
          echo "Deploying '$GITHUB_REF_NAME' to the $TARGET SWA."

      - name: Deploy to Azure Static Web Apps
        id: deploy
        # Docker action: the SHA pins the wrapper, but its image is Microsoft's
        # moving `:stable` tag, so the uploader itself can still change.
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1 (moving tag)
        with:
          # The environment's own token selects the matching SWA (prod or dev).
          # The "Check deploy token" step above guarantees it is non-empty.
          azure_static_web_apps_api_token: ${{ secrets.AZURE_SWA_TOKEN }}
          action: upload
          # We build with pnpm above; skip_app_build tells the action not to
          # run its own (Oryx) build. With the build skipped, `app_location`
          # is the folder the action uploads — point it straight at the
          # built `dist/`. (Pointing it at repo root uploads node_modules
          # and busts the SWA 250 MB content limit.) `output_location` is
          # unused when skip_app_build is true.
          skip_app_build: true
          app_location: "dist"
          api_location: ""
          output_location: ""
          # No deployment_environment: each branch deploys to ITS OWN SWA's
          # production environment (the token picks the SWA). The custom domain
          # for that environment binds to this production env.

      # Fail if the upload landed on the wrong app (e.g. the dev token pasted
      # into the production environment): the URL the deploy step reports must
      # be this environment's default hostname.
      - name: Check deploy target
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.static_web_app_url }}
          EXPECTED_HOST: ${{ github.ref_name == 'main' && 'polite-desert-0af64970f.5.azurestaticapps.net' || 'brave-river-0f2e36c0f.7.azurestaticapps.net' }}
        run: |
          if [ -z "$DEPLOY_URL" ]; then
            echo "::warning::Deploy step exposed no URL — can't confirm the target app."
            exit 0
          fi
          host="${DEPLOY_URL#*://}"
          host="${host%%/*}"
          if [ "$host" != "$EXPECTED_HOST" ]; then
            echo "::error::Deployed to $host, expected $EXPECTED_HOST — this environment's AZURE_SWA_TOKEN belongs to another app."
            exit 1
          fi
          echo "Deploy target confirmed: $host"

      # Post-deploy smoke test — `pnpm test` above checks the code; this
      # checks the LIVE site responds. Catches a deploy that uploaded but
      # serves a broken entry point. Uses the URL the deploy step reports;
      # if the action exposes none, it warns rather than red-failing.
      - name: Smoke-test the deployment
        # Action output passed via env (not interpolated into the script).
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.static_web_app_url }}
        run: |
          URL="$DEPLOY_URL"
          if [ -z "$URL" ]; then
            echo "::warning::Deploy step exposed no URL — skipping smoke test."
            exit 0
          fi
          case "$URL" in http*) ;; *) URL="https://$URL" ;; esac
          echo "Smoke-testing $URL ..."
          code=000
          for attempt in 1 2 3; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$URL/" || echo 000)
            [ "$code" = "200" ] && break
            echo "Attempt $attempt: HTTP $code — retrying in 10s"
            sleep 10
          done
          ctype=$(curl -s -o /dev/null -w '%{content_type}' "$URL/" || echo "")
          echo "Result: HTTP $code, Content-Type: $ctype"
          [ "$code" = "200" ] || { echo "::error::Smoke test failed — expected HTTP 200, got $code"; exit 1; }
          case "$ctype" in
            text/html*) ;;
            *) echo "::error::Smoke test failed — expected text/html, got '$ctype'"; exit 1 ;;
          esac
          echo "Smoke test passed."
