name: CI

# Checks every pull request into `development` or `main` before it merges:
# typecheck, tests, production build. Deploys happen only on push
# (deploy.yml), so a failing change is caught here instead of on the
# deploy run. No secrets are used — safe for pull requests.
on:
  pull_request:
    branches:
      - development
      - main

# One run per pull request; a new push supersedes the in-flight run.
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    # Branch protection requires this check BY NAME on main and development.
    # Renaming it leaves pull requests waiting on a check that never reports.
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to full commit SHAs (the tag is in the comment), so
      # a moved or compromised tag can't change the action code that runs.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # .nvmrc is the one place the Node major lives (also the Dockerfile's
          # node:22-alpine). pnpm 11 needs Node >= 22.13 (see deploy.yml).
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Machine-local hook checks must never come from the repository.
      - name: No tracked files in .githooks/local
        run: test -z "$(git ls-files .githooks/local)"

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
